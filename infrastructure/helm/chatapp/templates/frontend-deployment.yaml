apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatapp-frontend
  labels:
    app: chatapp-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatapp-frontend
  template:
    metadata:
      labels:
        app: chatapp-frontend
    spec:
      containers:
      - name: frontend
        image: "<your-acr-login-server>/chatapp-frontend:latest"
        ports:
        - containerPort: 80
        env:
        - name: BACKEND_URL
          value: "http://chatapp-backend.default.svc.cluster.local:8000"
